name: Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  deployments: write
  contents: write
  pull-requests: write

jobs:
  benchmark:
    uses: gofiber/.github/.github/workflows/benchmark.yml@main
    with:
      # ~9 months of default-branch pushes (59 in the 90 days before 2026-07)
      max-items-in-chart: 180
      # ~15 min per run for 86 top-level benchmarks; the weight sits in their 187
      # b.Run sub-benchmarks, which stay with their parent, so the split is by name.
      shards: 6
