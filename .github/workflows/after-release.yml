name: After Release

on:
  release:
    types: [published]
  repository_dispatch:
    types: [after-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    uses: gofiber/.github/.github/workflows/after-release.yml@main
    with:
      skip-wait: ${{ github.event_name == 'workflow_dispatch' }}
      # weekly releases arrive as repository_dispatch with the tag in the payload
      release-tag: ${{ github.event.release.tag_name || github.event.client_payload.tag }}
      repos: |
        - gofiber/fiber
        - gofiber/contrib
        - gofiber/storage
        - gofiber/template
        - gofiber/cli
        - gofiber/boilerplate
        - gofiber/recipes
        - gofiber/schema
    secrets:
      dispatch-token: ${{ secrets.DISPATCH_TOKEN }}
